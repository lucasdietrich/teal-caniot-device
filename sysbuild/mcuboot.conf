# Example of sample specific Kconfig changes when building sample with MCUboot
# when using sysbuild.

# No firmware signature
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_SIGNATURE_TYPE_RSA=n
CONFIG_BOOT_ENCRYPT_IMAGE=n

CONFIG_MCUBOOT_LOG_LEVEL_WRN=y

CONFIG_BOOT_UPGRADE_ONLY=n
# CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# Prefer swap move, don't use scratch partition
CONFIG_BOOT_PREFER_SWAP_MOVE=y

# disable unecessary TEAL board features
CONFIG_BOARD_TEAL_CANIOT_FULL_FEATURED=n